[package]
name = "screencast-portal-mock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mock org.freedesktop.portal.ScreenCast server for testing portal clients"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/screencast-portal-mock"
keywords = ["dbus", "screencast", "xdg-portal", "mock", "testing"]
categories = ["development-tools::testing"]
readme = "README.md"

[dependencies]
zbus        = { version = "5", features = ["tokio"] }
tokio       = { version = "1", features = ["full"] }
thiserror   = "2"
async-trait = "0.1"
bitflags    = "2"
tracing     = "0.1"
tempfile    = "3"

[dev-dependencies]
tokio              = { version = "1", features = ["full", "test-util"] }
proptest           = "1"
tracing-subscriber = "0.3"
futures-lite       = "2"
